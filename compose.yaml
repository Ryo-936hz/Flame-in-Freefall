# Optional future integration. Docker/PostgreSQL/pgvector NOT verified in this delivery.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flamelab
      POSTGRES_DB: flamelab
      POSTGRES_PASSWORD: ${FLAMELAB_POSTGRES_PASSWORD:?Set a local password before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
