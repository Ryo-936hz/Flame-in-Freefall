name: Verify integrated skeleton
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FLAMELAB_AI_PROVIDER: demo
      FLAMELAB_SEED_DEMO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: uv run ruff check apps/api scripts evals
      - run: uv run pytest -q
      - run: uv run python evals/science/run.py
      - run: uv run python evals/science/segment_run.py
      - run: uv run python evals/science/metric_availability_run.py
      - run: uv run python evals/ai/run.py
      - run: uv run python scripts/export-openapi.py --check
      - run: npm run check:types
      - run: npm run typecheck
      - run: npm run test:client
      - run: npm run build
      - run: uv run python scripts/smoke.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: flamelab
          POSTGRES_PASSWORD: flamelab-ci-only
          POSTGRES_DB: flamelab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flamelab -d flamelab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FLAMELAB_TEST_POSTGRES_URL: postgresql+psycopg://flamelab:flamelab-ci-only@localhost:5432/flamelab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --locked --extra postgres
      - run: uv run pytest -q apps/api/tests/test_postgres_integration.py
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:e2e:p6 -- --screenshots=work/p6-e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: p6-browser-${{ matrix.os }}
          path: work/p6-e2e
          if-no-files-found: ignore
          retention-days: 7
