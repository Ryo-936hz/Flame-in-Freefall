name: Verify integrated skeleton
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FLAMELAB_AI_PROVIDER: demo
      FLAMELAB_SEED_DEMO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: uv run ruff check apps/api scripts
      - run: uv run pytest -q
      - run: uv run python scripts/export-openapi.py --check
      - run: npm run check:types
      - run: npm run typecheck
      - run: npm run test:client
      - run: npm run build
      - run: uv run python scripts/smoke.py
